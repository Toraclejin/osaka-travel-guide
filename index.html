<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://unpkg.com; style-src 'unsafe-inline' https://unpkg.com; img-src data: https://*.basemaps.cartocdn.com; base-uri 'none'; form-action 'none';" />
<meta name="theme-color" content="#1a1b4b" />
<title>오사카 여행 가이드</title>
<meta name="description" content="오사카·교토 여행 가이드 — 구역별 관광지·맛집·카페, 탭하면 구글맵." />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1b4b'/%3E%3Ccircle cx='48' cy='16' r='6' fill='%23d94848'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='900' fill='%23f5f3ee' letter-spacing='-1'%3EO%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  /* =====================================================
     오사카 여행 가이드 — 단일 파일 · 외부 의존성 0 · 시스템 폰트
     ===================================================== */
  /* 루트 폰트 스케일 — 모든 font-size 가 rem 이라 여기 하나로 전체가 커진다.
     375px 에서 약 17.3px, 1080px 에서 약 19.8px, 그 이상은 20.5px 로 고정.
     px 고정이던 v0.7 까지는 PC 에서 글자가 작아 보였다. */
  html { font-size: clamp(17px, 16px + 0.35vw, 20.5px); -webkit-text-size-adjust: 100%; }

  :root {
    --frame:      #1a1b4b;
    --page:       #f5f3ee;
    --page-tint:  #ebe7df;
    --page-warm:  #efece4;
    --white:      #ffffff;
    --ink:        #2a2d3a;
    --ink-soft:   #5a5d6a;
    --ink-faint:  #8a8d99;
    --indigo:     #1a1b4b;
    --indigo-light:#4a4d8b;
    --osaka-red:  #D8452E;
    --gold:       #d4af37;
    --gold-dark:  #a08828;
    --gold-glow:  rgba(212,175,55,.4);
    --essential:      #C0455E;
    --essential-dark: #97324a;
    --essential-glow: rgba(192,69,94,.26);
    --line:       #d9d6cf;
    --line-faint: #e7e4dd;
    --shadow:     rgba(26,27,75,.10);

    --cat-sight:  #4A55A3;
    --cat-meal:   #D67025;
    --cat-cafe:   #8B6F47;

    --r:          12px;
    --pad-x:      clamp(18px, 5vw, 56px);

    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
            "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, system-ui, sans-serif;
    --serif: Georgia, "Times New Roman", "Apple SD Gothic Neo", serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(130% 55% at 50% -8%, rgba(74,77,139,.35), transparent 62%),
      var(--frame);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
    -webkit-font-smoothing: antialiased;
    padding: clamp(0px, 3vw, 40px);
    min-height: 100vh;
  }

  .sheet {
    max-width: 1080px;
    margin: 0 auto;
    background: var(--page);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(13,14,46,.45);
    position: relative;
  }
  .sheet::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, var(--osaka-red), var(--gold) 55%, var(--indigo-light));
    z-index: 2;
  }

  /* ===== Icons ===== */
  .ico { display: inline-flex; align-items: center; justify-content: center; }
  .ico svg { width: 1em; height: 1em; display: block; }

  /* ===== Masthead ===== */
  .masthead { padding: clamp(30px,7vw,60px) var(--pad-x) clamp(20px,4vw,30px); background: linear-gradient(180deg, var(--page-warm), var(--page)); }
  .kicker {
    font-size: 0.7188rem; font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    color: var(--osaka-red); display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
  }
  .kicker::before { content:''; width: 22px; height: 2px; background: var(--osaka-red); }
  .mast-title { font-size: clamp(58px,17vw,150px); font-weight: 900; letter-spacing: -.045em; line-height: .82; color: var(--indigo); }
  .mast-title .dot { color: var(--osaka-red); }
  .mast-sub { font-family: var(--serif); font-style: italic; font-size: clamp(19px,4.4vw,30px); color: var(--ink-soft); margin-top: 10px; }
  .mast-lede { margin-top: 16px; max-width: 56ch; font-size: 0.9375rem; color: var(--ink-soft); }

  .mast-meta { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 9px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--page-tint); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: 0.8125rem; color: var(--ink);
  }
  .pill .ico { color: var(--osaka-red); font-size: 0.9375rem; }
  .pill b { font-weight: 700; }

  /* ===== Sticky bar — 최상위 탭 + 구역/분류 내비를 한 덩어리로 =====
     둘을 각각 sticky top:0 으로 두면 서로 겹친다. 하나로 묶어야
     탭 높이가 rem 스케일로 변해도 계산 없이 항상 붙어 있는다. */
  .stickybar { position: sticky; top: 0; z-index: 40; }
  .nav {
    background: rgba(245,243,238,.9);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    backdrop-filter: saturate(180%) blur(10px);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .nav-row { display: flex; align-items: center; gap: 8px; padding: 9px var(--pad-x); }
  /* .nav-row.zones 의 점선 밑줄은 아래에 분류 필터 줄이 있을 때 둘을 가르던 선이다.
     v0.20 에서 그 줄이 사라지며 .nav 의 실선 위에 점선이 겹쳐 이중선이 됐다 — v0.21 에서 제거. */
  .nav-row .scroller {
    display: flex; gap: 7px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; flex: 1; padding-bottom: 1px;
  }
  .nav-row .scroller::-webkit-scrollbar { display: none; }
  .nav-lbl { font-size: 0.7188rem; font-weight: 700; letter-spacing: .12em; color: var(--ink-faint); text-transform: uppercase; flex-shrink: 0; }

  .chip {
    flex-shrink: 0; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line); background: var(--white); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 13px; font-size: 0.8125rem; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px; line-height: 1;
    transition: background .15s, color .15s, border-color .15s; font-family: inherit;
  }
  .chip:hover { border-color: var(--indigo-light); color: var(--indigo); }
  .chip .cnt { font-size: 0.75rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .chip .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .zone-chip[aria-current="true"] { background: var(--zc, var(--indigo)); border-color: var(--zc, var(--indigo)); color: #fff; }
  /* v0.20 에서 분류 필터를 지우며 .chip[aria-pressed] · .chip.rec · .chip.ess 규칙이 죽었다.
     v0.21 에서 제거. 지금 .chip 을 쓰는 건 구역(DAY) 칩 하나뿐이다. */

  /* ===== Body ===== */
  .body { padding: clamp(18px,4vw,34px) var(--pad-x) clamp(40px,8vw,72px); }

  .zone { margin-top: clamp(30px,6vw,48px); scroll-margin-top: 104px; }
  .zone:first-child { margin-top: 6px; }

  .zone-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 11px; border-bottom: 2px solid var(--zc, var(--indigo)); }
  .zone-tag {
    display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
    background: var(--zc); color: #fff; border-radius: 7px; padding: 5px 10px;
    font-size: 0.75rem; font-weight: 800; letter-spacing: .04em;
  }
  .zone-name { font-family: var(--serif); font-weight: 700; font-size: clamp(27px,6vw,46px); line-height: 1; color: var(--indigo); letter-spacing: -.01em; }
  /* 최상위 탭 — 여행 / 알아둘 것 / 일본어 */
  .toptabs { display: flex; gap: 0; padding: 0 var(--pad-x); background: var(--page); }
  .toptab { flex: 1; min-height: 52px; border: 0; border-bottom: 3px solid transparent; background: none;
            font: inherit; font-size: 0.9375rem; font-weight: 700; color: var(--ink-faint); cursor: pointer;
            letter-spacing: -.01em; transition: color .15s, border-color .15s; }
  .toptab.is-on { color: var(--indigo); border-bottom-color: var(--osaka-red); }
  .toptab:active { background: var(--page-tint); }
  .toppanel.is-hide, .nav.is-hide { display: none; }

  /* 탭 안 항목 — <details> 로 접어둔다 */
  .ti-lede { margin: 4px 0 13px; font-size: 0.8125rem; color: var(--ink-faint); }
  .ti-item { border: 1px solid var(--line); border-radius: 10px; background: var(--white); margin-bottom: 8px; overflow: hidden; }
  .ti-item[open] { border-color: var(--osaka-red); }
  .ti-sum { display: flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 13px; cursor: pointer; list-style: none; }
  .ti-sum::-webkit-details-marker { display: none; }
  /* 열고 닫기 표시 — 테두리로 그린 화살표.
     닫힘: 아래(∨, "펼쳐진다")  ·  열림: 옆(>, "접힌다"). 회전 하나로 전환된다. */
  .ti-sum::after, .pd-sum::after {
    content: ''; margin-left: auto; flex: none; width: .46em; height: .46em;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translate(-.1em, -.1em);
    transition: transform .18s ease; color: var(--ink-faint);
  }
  .ti-item[open] .ti-sum::after, .p-deep[open] .pd-sum::after {
    transform: rotate(-45deg) translate(-.05em, .05em); color: var(--osaka-red);
  }
  .ti-ico { font-size: 1.0625rem; flex: none; }
  .ti-lbl { font-size: 0.9375rem; font-weight: 700; }
  .ti-cnt { font-size: 0.75rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .ti-list { margin: 0; padding: 2px 15px 13px 32px; font-size: 0.8438rem; color: var(--ink-soft); line-height: 1.6; }
  .ti-list li { margin: 5px 0; }
  .ti-list b, .ph-tips b { color: var(--ink); }
  .ph { padding: 9px 13px; border-top: 1px solid var(--line-faint); }
  .ph-ko { font-size: 0.8125rem; color: var(--ink-faint); }
  .ph-ja { font-size: 1rem; font-weight: 700; margin-top: 2px; line-height: 1.45; }
  .ph-ro { font-size: 0.75rem; color: var(--ink-faint); font-style: italic; margin-top: 1px; }
  .ph-kr { font-size: 0.8125rem; color: var(--osaka-red); font-weight: 600; margin-top: 2px; letter-spacing: -.01em; }
  .ph-tips { border-top: 1px solid var(--line-faint); background: var(--page-tint); padding: 11px 13px 12px; }
  .ph-tips-h { font-size: 0.6875rem; font-weight: 800; letter-spacing: .08em; color: var(--osaka-red); margin-bottom: 5px; }
  .ph-tips ul { margin: 0; padding-left: 17px; font-size: 0.8125rem; color: var(--ink-soft); line-height: 1.55; }
  .ph-tips li { margin: 3px 0; }

  /* 선착장 ↔ 숙소 이동 — 페이지 맨 위(도착)와 맨 아래(복귀) */
  .transfer { margin: 26px 0 34px; background: var(--frame); color: var(--page); border-radius: var(--r); padding: 18px 17px 16px; }
  .tr-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .tr-tag { background: var(--osaka-red); color: #fff; font-size: 0.7188rem; font-weight: 800; letter-spacing: .1em; padding: 4px 8px; border-radius: 4px; flex: none; }
  .tr-title { font-size: 1.0625rem; margin: 0; letter-spacing: -.01em; }
  .tr-date { margin-left: auto; font-size: 0.75rem; color: #b9b7c8; flex: none; }
  .tr-lede { margin: 10px 0 0; font-size: 0.8438rem; color: #cfcede; }
  .tr-warn { display: flex; gap: 8px; margin-top: 13px; padding: 11px 12px; border-radius: 8px; background: rgba(216,69,46,.16); border: 1px solid rgba(216,69,46,.5); }
  .tr-warn-ico { flex: none; color: var(--osaka-red); display: inline-flex; margin-top: 1px; }
  .tr-warn-t { font-size: 0.8125rem; color: #f0eef7; line-height: 1.55; }
  .tr-warn-t b { color: #fff; }
  .tr-row { display: grid; grid-template-columns: 58px 1fr; gap: 11px; padding: 9px 0; border-top: 1px solid rgba(245,243,238,.14); }
  .tr-row:first-of-type { margin-top: 13px; }
  .tr-t { font-size: 0.7813rem; font-weight: 800; color: var(--osaka-red); font-variant-numeric: tabular-nums; }
  .tr-w { font-size: 0.875rem; }
  .tr-d { font-size: 0.7813rem; color: #b9b7c8; margin-top: 2px; line-height: 1.5; }
  .tr-need { margin-top: 15px; padding: 12px 13px; background: rgba(245,243,238,.08); border-radius: 8px; }
  .tr-need-h { font-size: 0.7188rem; font-weight: 700; letter-spacing: .08em; color: var(--osaka-red); margin-bottom: 6px; }
  .tr-need-l { margin: 0; padding-left: 17px; font-size: 0.8125rem; color: #dedcea; }
  .tr-need-l li { margin: 3px 0; }
  .tr-tip { margin: 13px 0 0; font-size: 0.7813rem; color: #b9b7c8; font-style: italic; }
  /* 이동 구간 — 노선 기호 + 구글맵 길찾기 */
  .mv { display: block; margin-top: 8px; padding: 9px 11px; border: 1px solid var(--line);
        border-radius: 9px; background: var(--white); text-decoration: none; color: inherit; }
  .mv:hover { border-color: var(--osaka-red); }
  .mv-lines { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .mv-ln { display: inline-flex; align-items: center; gap: 5px; }
  .mv-c { display: inline-flex; align-items: center; justify-content: center; flex: none;
          min-width: 1.32em; height: 1.32em; border-radius: 50%; color: #fff;
          font-size: .68rem; font-weight: 800; line-height: 1; }
  .mv-nm { font-size: .76rem; font-weight: 700; color: var(--ink); }
  .mv-via { display: block; margin-top: 5px; font-size: .74rem; color: var(--ink-soft); line-height: 1.5; }
  .mv-go { display: block; margin-top: 6px; font-size: .76rem; font-weight: 700; color: var(--osaka-red); }
  /* 도착·복귀 블록(인디고 면) 안에서는 색을 뒤집는다 */
  .mv-hero { background: rgba(245,243,238,.10); border-color: rgba(245,243,238,.26); margin-top: 13px; padding: 12px 13px; }
  .mv-hero .mv-nm { color: var(--page); }
  .mv-hero .mv-via { color: #cfcede; }
  .mv-hero:hover { border-color: var(--osaka-red); }

  /* 이 날의 흐름 — zone.schedule */
  .zone-sched { margin: 15px 0 6px; background: var(--page-warm); border: 1px solid var(--line-faint); border-radius: var(--r); overflow: hidden; }
  .zs-head { display: flex; align-items: center; gap: 7px; padding: 9px 13px; background: var(--zc, var(--indigo)); color: var(--page); }
  .zs-head .zs-ico { display: inline-flex; opacity: .85; }
  .zs-head-t { font-size: 0.7813rem; font-weight: 700; letter-spacing: .02em; }
  .zs-head-n { margin-left: auto; font-size: 0.7188rem; opacity: .8; }
  .zs-row { display: grid; grid-template-columns: 56px 1fr; gap: 11px; padding: 9px 13px; border-top: 1px solid var(--line-faint); }
  .zs-row:first-of-type { border-top: 0; }
  .zs-t { font-size: 0.8125rem; font-weight: 800; color: var(--zc, var(--indigo)); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .zs-w { font-size: 0.875rem; line-height: 1.45; }
  .zs-n { font-size: 0.7813rem; color: var(--ink-soft); margin-top: 2px; }
  .zone-date { font-size: 0.75rem; font-weight: 700; color: var(--zc, var(--indigo)); background: var(--page-tint); border-radius: 999px; padding: 3px 10px; flex: none; letter-spacing: .01em; }
  .zone-access { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 0.7813rem; color: var(--ink-faint); }
  .zone-access .ico { color: var(--zc); font-size: 0.875rem; }

  /* ===== Zone map link (탭하면 실제 구글맵으로 그 구역이 열림) ===== */
  .zone-map-link {
    margin-top: 13px; display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--ink);
    background: var(--page-warm); border: 1px solid var(--line); border-left: 4px solid var(--zc);
    border-radius: var(--r); padding: 12px 15px;
    transition: box-shadow .16s, transform .16s, border-color .16s;
    -webkit-tap-highlight-color: rgba(26,27,75,.06);
  }
  .zone-map-link:hover { box-shadow: 0 8px 20px var(--shadow); transform: translateY(-1px); }
  .zone-map-link:active { transform: translateY(0); box-shadow: 0 3px 10px var(--shadow); }
  .zml-icon { width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0; background: var(--zc); color: #fff; display: flex; align-items: center; justify-content: center; }
  .zml-icon .ico { font-size: 1.25rem; }
  .zml-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .zml-title { font-size: 0.9063rem; font-weight: 700; color: var(--ink); }
  .zml-sub { font-size: 0.75rem; color: var(--ink-faint); margin-top: 1px; }
  .zml-arrow { flex-shrink: 0; font-size: 1.125rem; color: var(--zc); transition: transform .15s; }
  .zone-map-link:hover .zml-arrow { transform: translateX(3px); }

  /* ===== Zone embedded map (실제 구글맵 iframe + 하단 전체화면 버튼) ===== */
  .zone-map { margin-top: 13px; border: 1px solid var(--line); border-left: 4px solid var(--zc); border-radius: var(--r); overflow: hidden; background: var(--page-warm); }
  .zone-map-canvas { width: 100%; height: clamp(210px, 48vw, 300px); background: var(--page-tint); z-index: 0; }
  .zone-map-canvas.leaflet-container { font: inherit; background: var(--page-tint); }
  .zone-map .zone-map-link { margin-top: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: #fff; }
  .zone-map .zone-map-link:hover { transform: none; box-shadow: none; background: var(--page-warm); }
  .zone-map .zone-map-link:active { transform: none; }
  .map-pop .mp-name { font-weight: 700; font-size: 0.875rem; color: var(--ink); }
  .map-pop .mp-feat { font-size: 0.75rem; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; }
  .map-pop .mp-link { display: inline-block; margin-top: 7px; font-size: 0.7813rem; font-weight: 700; color: var(--indigo); text-decoration: none; }
  .map-pop .mp-link:hover { color: var(--osaka-red); }
  /* 번호 핀 + 범례 — 지도에서 어느 점이 어디인지 바로 보이게 (todo 2026-06-21) */
  .zm-pin.leaflet-div-icon { background: transparent; border: 0; }
  .zm-pin-dot { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 0.7188rem; font-weight: 800; line-height: 1; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); font-family: inherit; }
  .zm-pin.is-rec .zm-pin-dot { box-shadow: 0 0 0 2px rgba(212,175,55,.5), 0 1px 5px rgba(0,0,0,.4); }
  /* 숙소 핀 — base_hotel 에 좌표가 들어올 때만 그려진다 (숙소 미정이면 아예 없음) */
  .zm-pin-home { background: var(--frame); border-radius: 5px; width: 18px; height: 18px; }
  .zm-pin.is-home .zm-pin-dot { box-shadow: 0 0 0 2px rgba(26,27,75,.35), 0 1px 5px rgba(0,0,0,.35); }
  .zm-legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 11px 12px; border-top: 1px solid var(--line); background: #fff; }

  .zm-leg-item.is-hover { border-color: var(--zc); }

  .leaflet-popup-content { margin: 11px 13px; font-family: inherit; }

  /* 원정 길찾기 버튼 — 숙소 → 원정 목적지 */
  .dir-btn { display: flex; align-items: center; gap: 12px; text-decoration: none; background: var(--zc); color: #fff; border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 8px 22px rgba(168,51,106,.26); transition: transform .15s, box-shadow .15s; -webkit-tap-highlight-color: rgba(0,0,0,.1); }
  .dir-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(168,51,106,.34); }

  .dir-ico { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dir-ico .ico { font-size: 1.375rem; }
  .dir-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dir-t { font-size: 0.9375rem; font-weight: 800; }
  .dir-sub { font-size: 0.7188rem; opacity: .9; margin-top: 1px; }
  .dir-arrow { flex-shrink: 0; font-size: 1.25rem; }

  /* ===== Category section ===== */
  .catsec { margin-top: clamp(18px,4vw,26px); }
  .cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
  .cat-badge { display: inline-flex; align-items: center; gap: 6px; color: #fff; border-radius: 7px; padding: 5px 11px 5px 9px; font-size: 0.7188rem; font-weight: 800; letter-spacing: .1em; }
  .cat-badge .ico { font-size: 0.875rem; }
  .cat-ko { font-size: 0.875rem; font-weight: 700; color: var(--ink); }
  .cat-line { flex: 1; height: 1px; background: var(--line-faint); }
  .cat-cnt { font-size: 0.75rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  /* ===== Place cards ===== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px,1fr)); gap: 11px; }
  .place {
    display: flex; flex-direction: column;
    background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: var(--r); position: relative; overflow: hidden;
    transition: box-shadow .16s, transform .16s, border-color .16s;
    -webkit-tap-highlight-color: rgba(26,27,75,.06);
  }
  /* 지도 링크 — 카드 안쪽. 바깥(.place)은 필터·스타일용 컨테이너다 */
  .p-link { display: flex; flex-direction: column; text-decoration: none; color: inherit; padding: 15px 16px 13px; }

  /* 장소 심층 정보 — 접어둔다 */
  .p-deep { border-top: 1px dashed var(--line); }
  .pd-sum { display: flex; align-items: center; min-height: 42px; padding: 0 16px; cursor: pointer;
            list-style: none; font-size: 0.8125rem; font-weight: 700; color: var(--ink-soft); }

  .pd-body { padding: 2px 16px 15px; background: var(--page-warm); }
  .pd-what { margin: 8px 0 0; font-size: 0.8438rem; line-height: 1.65; color: var(--ink); }
  .pd-h { font-size: 0.6875rem; font-weight: 800; letter-spacing: .08em; color: var(--accent); margin: 13px 0 5px; }
  .pd-see { margin: 0; padding-left: 17px; font-size: 0.8438rem; line-height: 1.6; color: var(--ink-soft); }
  .pd-see li { margin: 4px 0; }
  .pd-insight { margin: 0; font-size: 0.8438rem; line-height: 1.65; color: var(--ink-soft);
                border-left: 2px solid var(--accent); padding-left: 10px; }

  .pd-link { display: inline-block; margin-top: 12px; font-size: 0.8125rem; font-weight: 700;
             color: var(--indigo); text-decoration: none; }
  .pd-link:hover { text-decoration: underline; color: var(--osaka-red); }
  .place:hover { box-shadow: 0 10px 24px var(--shadow); transform: translateY(-2px); }
  .place:active { transform: translateY(0); box-shadow: 0 4px 12px var(--shadow); }
  .place.rec { background: linear-gradient(180deg,#fffdf4,#fff); }
  .place.essential { background: linear-gradient(180deg,#fff6f8,#fff); }
  .p-essential { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; background: var(--essential); color: #fff; font-size: 0.7188rem; font-weight: 800; letter-spacing: .02em; border-radius: 999px; padding: 3px 9px; box-shadow: 0 0 0 3px var(--essential-glow); white-space: nowrap; }

  .p-top { display: flex; align-items: flex-start; gap: 9px; }
  .p-name { flex: 1; font-size: 1.0313rem; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .p-star { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; background: var(--gold); color: #3a2e05; font-size: 0.7188rem; font-weight: 800; letter-spacing: .04em; border-radius: 999px; padding: 3px 8px 3px 6px; box-shadow: 0 0 0 3px var(--gold-glow); white-space: nowrap; }
  .p-star .ico { font-size: 0.75rem; }
  .p-en { font-size: 0.7188rem; font-weight: 500; letter-spacing: .04em; color: var(--ink-faint); margin-top: 3px; }
  .p-feat { font-size: 0.8438rem; color: var(--ink-soft); margin-top: 9px; flex: 1; }

  .p-feat b { color: var(--ink); }
  .p-go { margin-top: 13px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.7813rem; font-weight: 700; color: var(--indigo); }
  .p-go .ico { font-size: 0.875rem; color: var(--osaka-red); }
  .p-go .arrow { transition: transform .15s; }
  .place:hover .p-go { color: var(--osaka-red); }
  .place:hover .p-go .arrow { transform: translateX(3px); }

  /* ===== 원정(Excursion) 섹션 — 하루 통째로 쓰는 시외 일정 전용 블록 ===== */
  .excursion {
    margin-top: clamp(30px,6vw,52px);
    scroll-margin-top: 104px;
    background: linear-gradient(180deg, #faf1f6, var(--page) 55%);
    border: 1.5px solid var(--zc);
    border-radius: 16px;
    padding: clamp(16px,4vw,30px);
    box-shadow: 0 14px 36px rgba(168,51,106,.12);

    overflow: hidden;

  .excursion .zone-tag { background: var(--zc); }
  .ex-scope { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; font-size: 0.75rem; font-weight: 700; letter-spacing: .02em; color: var(--zc); background: rgba(168,51,106,.08); border: 1px solid rgba(168,51,106,.25); border-radius: 999px; padding: 6px 12px; }
  .ex-scope .ico { font-size: 0.8125rem; }
  .ex-intro { margin-top: 12px; font-size: 0.9063rem; color: var(--ink-soft); max-width: 60ch; }
  .block-h { display: flex; align-items: center; gap: 9px; margin: clamp(20px,4vw,28px) 0 13px; }
  .block-h .bh-bar { width: 16px; height: 2px; background: var(--zc); }
  .block-h .bh-t { font-size: 0.75rem; font-weight: 800; letter-spacing: .12em; color: var(--zc); text-transform: uppercase; }
  .block-h .bh-ko { font-size: 0.9375rem; font-weight: 700; color: var(--ink); }

  .route-card { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--zc); border-radius: var(--r); padding: 14px 16px; }
  .route-card + .route-card { margin-top: 10px; }
  a.route-card { display: block; text-decoration: none; color: inherit; cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; -webkit-tap-highlight-color: rgba(168,51,106,.08); }
  a.route-card:hover { box-shadow: 0 10px 24px var(--shadow); transform: translateY(-1px); border-color: var(--zc); }
  a.route-card:active { transform: translateY(0); box-shadow: 0 3px 10px var(--shadow); }
  .rc-go { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line-faint); display: flex; align-items: center; gap: 7px; font-size: 0.7813rem; font-weight: 700; color: var(--zc); }
  .rc-go .ico { font-size: 0.9375rem; }
  .rc-go .rc-go-arrow { margin-left: auto; transition: transform .15s; }
  a.route-card:hover .rc-go-arrow { transform: translateX(3px); }
  .rc-head { display: flex; align-items: center; gap: 10px; }
  .rc-num { width: 26px; height: 26px; border-radius: 50%; background: var(--zc); color: #fff; font-weight: 800; font-size: 0.8125rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rc-name { flex: 1; font-size: 0.9375rem; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .rc-best { font-size: 0.7188rem; font-weight: 800; letter-spacing: .04em; color: #fff; background: var(--zc); border-radius: 999px; padding: 2px 7px; }
  .rc-meta { font-size: 0.75rem; color: var(--ink-faint); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rc-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 11px; }
  .rc-step { background: var(--page-tint); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; font-size: 0.8125rem; font-weight: 600; color: var(--ink); }
  .rc-conn { display: inline-flex; align-items: center; gap: 4px; color: var(--zc); font-size: 0.75rem; font-weight: 600; }
  .rc-conn .ico { font-size: 0.8125rem; }
  .rc-note { margin-top: 10px; font-size: 0.8125rem; color: var(--ink-soft); line-height: 1.55; }

  .info-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .info-list li { display: flex; gap: 9px; font-size: 0.8438rem; color: var(--ink-soft); }
  .info-list li .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--zc); margin-top: 7px; flex-shrink: 0; }

  .todo-list { border-top: 1px solid var(--line-faint); }
  .todo-item { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line-faint); }
  .todo-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--zc); color: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .todo-mark .ico { font-size: 0.8125rem; }
  .todo-t { font-size: 0.875rem; font-weight: 700; color: var(--ink); }
  .todo-d { font-size: 0.8125rem; color: var(--ink-soft); margin-top: 2px; line-height: 1.55; }
  .dine-note { margin: 10px 0 4px; font-size: 0.7813rem; color: var(--ink-faint); }

  .foot { border-top: 1px solid var(--line); padding: 22px var(--pad-x) 28px; color: var(--ink-faint); font-size: 0.75rem; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }

  /* ===== Back to top ===== */
  .totop {
    position: fixed; right: 16px; bottom: 16px; z-index: 40;
    width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--indigo); color: #fff; font-size: 1.125rem;
    box-shadow: 0 6px 18px rgba(13,14,46,.4); display: none; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s;
  }
  .totop.show { display: flex; opacity: 1; }
  .totop .ico { font-size: 1.25rem; }

  /* ===== 모바일 범용성 =====
     기준 뷰포트는 375×812 지만, 320px(구형 SE)부터 태블릿·PC 까지 안 깨지게.
     - 손가락 탭 타깃은 최소 44px (Apple HIG). 여행 중 걸으면서 누른다.
     - 줄바꿈은 keep-all + break-word 로 한국어가 어절 중간에 안 끊기게.
     - 폰트는 rem 이라 html 의 clamp 하나로 전 화면이 같이 커진다. */
  .chip, .zone-chip { min-height: 44px; }
  .zm-leg-item { min-height: 40px; padding: 6px 13px 6px 5px; }
  .p-go, .rc-go, .mp-link { display: inline-flex; align-items: center; min-height: 32px; }
  .place, .route-card, .dir-btn, .zone-map-link { -webkit-tap-highlight-color: rgba(216,69,46,.12); }

  /* 아주 좁은 화면 (320~359px) — 여백을 줄여 본문 폭을 확보 */
  @media (max-width: 359px) {
    :root { --pad-x: 14px; }
    .zs-row, .tr-row { grid-template-columns: 52px 1fr; gap: 8px; }
    .zone-tag, .tr-tag { letter-spacing: .04em; }
  }

  /* 태블릿 이상 — 카드가 좁아 보이지 않게 최소폭을 키운다 (글자가 커졌으므로) */
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 13px; }
    .zs-row, .tr-row { grid-template-columns: 74px 1fr; }
  }

  /* 넓은 화면 — 한 줄이 너무 길어지면 읽기 힘들다. 본문 계열만 폭을 제한 */
  @media (min-width: 1000px) {
    .tr-lede, .zs-w, .tr-w, .p-feat { max-width: 62ch; }

  @media (max-width: 600px) {
    body { padding: 0; }
    .sheet { border-radius: 0; box-shadow: none; }
    .grid { grid-template-columns: 1fr; }
    .zone-access { margin-left: 0; width: 100%; margin-top: 2px; }
    .nav-row { padding-top: 8px; padding-bottom: 8px; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; max-width: 100%; }
    .nav, .totop { display: none; }
    .place { break-inside: avoid; transform: none; box-shadow: none; }
    .zone, .catsec { break-inside: avoid; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; transition: none !important; } }
</style>

<body>
  <main class="sheet">
    <header class="masthead">
      <div class="kicker">A Travel Guide · 같이 가는 오사카</div>
      <h1 class="mast-title">OSAKA<span class="dot">.</span></h1>
      <div class="mast-sub" id="mast-sub">오사카 여행 가이드</div>
      <p class="mast-lede">8/24 입항 ~ 8/26 출항, 2박 3일. 날짜별로 <b>흐름</b>과 <b>지도 동선</b>을 깔아뒀어. 시각은 참고용이고 — 박아둔 건 시설 마감이랑 배 시간뿐이야. 늦으면 그냥 뒤로 밀면 돼. 장소를 탭하면 구글맵이 열려. <b>★</b>는 특히 추천, <b>🇰🇷</b>는 오사카 오면 다들 가는 곳.</p>
      <div class="mast-meta" id="mast-meta"></div>

        <span class="nav-lbl">구역</span>

      </div>
    </nav>
    </div><!-- /stickybar -->

    <div class="body" id="body"></div>

    <footer class="foot">
      <span>탭하면 구글맵이 새 탭에서 열립니다</span>
      <span id="foot-count"></span>
    </footer>
  </main>

  <button class="totop" id="totop" aria-label="맨 위로" type="button"></button>

<script>
/* ============================================================
   데이터 — 단일 정본 (사이드카 JSON 없음. R-D1 참고)
   장소 추가/수정 시 이 객체만 고치면 됨.

   원정(Excursion) — 하루를 통째로 쓰는 시외 일정.
   zone 과 다른 점: "가는 법 / 도착 후 / 해야 할 것" 이 본체이고, 장소 목록은 부록.
   sections[] 는 zone 과 완전히 같은 스키마 → buildZoneMap · buildCard · 필터 전부 그대로 재사용.
   원정 추가 시 이 배열에 객체 하나만 push (USJ · 나라 · 고베 등).
   ⚠ routes 의 소요시간·요금은 변동됨. 출발 전 1회 재확인 (CLAUDE.md § 출발 전 점검).
   ============================================================ */
// 교토 원정 제외 확정 (2026-08-10) — 2박3일 28.5h 에 하루짜리 원정이 안 들어감.
// 엔진은 그대로 두므로 EXCURSIONS 에 객체를 push 하면 즉시 되살아난다. 이전 교토 데이터는 git 이력에 있음.
const EXCURSIONS = [];


/* ============================================================
   DOM helpers — 사용자 텍스트는 textContent, SVG는 정적 상수만 innerHTML
   ============================================================ */
function E(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function icon(markup, cls) {
  const s = document.createElement('span');
  s.className = 'ico' + (cls ? ' ' + cls : '');
  s.innerHTML = markup;          // markup = SVG 상수만 (사용자 데이터 아님)
  return s;
}
function zoneAccent(i) { return ZONE_ACCENTS[i % ZONE_ACCENTS.length]; }

/* 장소 순회 — 구역(zone) + 원정(excursion) 양쪽. 필터 칩 카운트·총계가 둘 다 반영됨. */
function eachPlace(fn) {
  GUIDE_DATA.zones.forEach((z, zi) => z.sections.forEach(s => s.places.forEach(p => fn(p, s, z, zi))));
  EXCURSIONS.forEach(ex => (ex.sections || []).forEach(s => s.places.forEach(p => fn(p, s, ex, -1))));
}
function count(pred) { let n = 0; eachPlace((p, s, z) => { if (pred(p, s, z)) n++; }); return n; }

/* ============================================================
   렌더 — 마스트헤드 / 내비 / 구역
   ============================================================ */
function renderMast() {
  document.getElementById('mast-sub').textContent = GUIDE_DATA.title;
  const meta = document.getElementById('mast-meta');
  const h = GUIDE_DATA.base_hotel;
  if (h) {
    const p = E('span', 'pill');
    p.appendChild(icon(SVG.hotel));
    const t = E('span');
    t.appendChild(E('b', null, h.name));
    if (h.note) t.appendChild(document.createTextNode(' · ' + h.note));
    p.appendChild(t);
    meta.appendChild(p);
  }
  const total = count(() => true);
  const p2 = E('span', 'pill');
  p2.appendChild(icon(SVG.grid));
  const exN = EXCURSIONS.length;
  p2.appendChild(document.createTextNode(GUIDE_DATA.zones.length + '개 구역' + (exN ? ' + 원정 ' + exN : '') + ' · 총 ' + total + '곳'));
  meta.appendChild(p2);
  document.getElementById('foot-count').textContent = total + ' places · ' + GUIDE_DATA.zones.length + ' areas' + (EXCURSIONS.length ? ' + ' + EXCURSIONS.length + ' excursion' : '');
}

function renderNav() {
  // 구역 바로가기
  const zn = document.getElementById('zone-nav');
  GUIDE_DATA.zones.forEach((z, zi) => {
    const b = E('button', 'chip zone-chip');
    b.type = 'button';
    b.dataset.target = 'zone-' + z.id;
    b.style.setProperty('--zc', zoneAccent(zi));
    b.appendChild(E('span', null, (z.date ? z.date.replace(/ .*/, '') : String(z.id).padStart(2, '0')) + ' ' + z.name));
    b.addEventListener('click', () => {
      const el = document.getElementById('zone-' + z.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    zn.appendChild(b);
  });
  // 원정 섹션 바로가기 (EXCURSIONS 개수만큼)
  EXCURSIONS.forEach(ex => {
    const dz = E('button', 'chip zone-chip');
    dz.type = 'button';
    dz.dataset.target = 'ex-' + ex.id;
    dz.style.setProperty('--zc', ex.accent);
    dz.appendChild(E('span', null, ex.chip || ex.title));
    dz.addEventListener('click', () => {
      const el = document.getElementById('ex-' + ex.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    zn.appendChild(dz);
  });
}

/* 장소 심층 정보 — place.deep 이 있을 때만. 네이티브 <details> 로 접어둔다.
   ⚠ <a> 안에 <details> 를 넣을 수 없다 (대화형 요소 중첩 금지 + 클릭이 링크로 샌다).
      그래서 카드 바깥을 div.place 로 두고, 지도 링크는 안쪽 a.p-link 가 맡는다. */
function buildDeep(d) {
  const det = document.createElement('details');
  det.className = 'p-deep';
  const sum = document.createElement('summary');
  sum.className = 'pd-sum';
  sum.appendChild(E('span', 'pd-sum-t', '어떤 곳이고 뭘 볼까'));
  det.appendChild(sum);

  const box = E('div', 'pd-body');
  if (d.what) box.appendChild(rich(E('p', 'pd-what'), d.what));
  if (d.see && d.see.length) {
    box.appendChild(E('div', 'pd-h', '이건 보고 오자'));
    const ul = E('ul', 'pd-see');
    d.see.forEach(s => ul.appendChild(rich(E('li', null), s)));
    box.appendChild(ul);
  }
  if (d.insight) {
    box.appendChild(E('div', 'pd-h', '알고 보면'));
    box.appendChild(rich(E('p', 'pd-insight'), d.insight));
  }
  if (d.link && d.link.url) {
    const a = document.createElement('a');
    a.className = 'pd-link';
    a.href = d.link.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = (d.link.label || '더 읽기') + ' →';
    box.appendChild(a);
  }
  det.appendChild(box);
  return det;
}

function buildCard(p, cat) {
  const wrap = E('div', 'place' + (p.recommended ? ' rec' : '') + (p.essential ? ' essential' : ''));
  wrap.style.setProperty('--accent', cat.color);
  wrap.dataset.cat = cat.key;
  wrap.dataset.rec = p.recommended ? '1' : '0';
  wrap.dataset.ess = p.essential ? '1' : '0';

  const a = document.createElement('a');
  a.className = 'p-link';
  a.href = p.maps_url || '#';
  a.target = '_blank';
  a.rel = 'noopener noreferrer';

  const top = E('div', 'p-top');
  top.appendChild(E('div', 'p-name', p.name_ko));
  // 한국인 필수 배지가 추천(★)보다 우선 — 카드당 배지 하나로 정리
  if (p.essential) {
    top.appendChild(E('span', 'p-essential', '🇰🇷 한국인 필수'));
  } else if (p.recommended) {
    const st = E('span', 'p-star');
    st.appendChild(icon(SVG.star));
    st.appendChild(E('span', null, '추천'));
    top.appendChild(st);
  }
  a.appendChild(top);
  if (p.name_en && p.name_en !== p.name_ko) a.appendChild(E('div', 'p-en', p.name_en));
  // feature 도 `**강조**` 를 쓴다 — deep 만 rich() 를 태우고 여기는 안 태워서
  // 카드 37장 중 24장에 별표가 그대로 찍혀 있었다 (v0.21 에서 발견 · learning.md § 18)
  if (p.feature) a.appendChild(rich(E('p', 'p-feat'), p.feature));

  const go = E('div', 'p-go');
  go.appendChild(icon(SVG.pin));
  go.appendChild(E('span', null, '구글맵 열기'));
  go.appendChild(icon(SVG.arrow, 'arrow'));
  a.appendChild(go);

  wrap.appendChild(a);
  if (p.deep) wrap.appendChild(buildDeep(p.deep));
  return wrap;
}

/* 구역 중심 좌표 (장소들의 평균) — offzone(구역서 멀리 떨어진 장소)은 중심 계산에서 제외 */
function zoneCenter(zone) {
  let n = 0, la = 0, ln = 0;
  zone.sections.forEach(s => s.places.forEach(p => { if (!p.offzone && typeof p.lat === 'number' && typeof p.lng === 'number') { la += p.lat; ln += p.lng; n++; } }));
  return n ? { lat: la / n, lng: ln / n, n: n } : null;
}

/* "이 구역 구글맵에서 보기" 버튼 — 탭하면 그 동네가 실제 구글맵으로 열림(외부 임베드 X) */
function buildZoneMapLink(zone, accent) {
  const c = zoneCenter(zone);
  if (!c) return null;
  let total = 0, rec = 0;
  zone.sections.forEach(s => s.places.forEach(p => { total++; if (p.recommended) rec++; }));

  const a = document.createElement('a');
  a.className = 'zone-map-link';
  a.href = 'https://www.google.com/maps/@?api=1&map_action=map&center=' + c.lat.toFixed(6) + ',' + c.lng.toFixed(6) + '&zoom=14';
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.style.setProperty('--zc', accent);

  const ib = E('span', 'zml-icon');
  ib.appendChild(icon(SVG.map));
  a.appendChild(ib);

  const tx = E('span', 'zml-text');
  tx.appendChild(E('span', 'zml-title', '이 구역 구글맵에서 보기'));
  tx.appendChild(E('span', 'zml-sub', zone.name + ' · ' + total + '곳' + (rec ? ' · 추천 ' + rec : '')));
  a.appendChild(tx);

  a.appendChild(icon(SVG.arrow, 'zml-arrow'));
  return a;
}

const ZONE_MAP_REG = [];
function buildZoneMap(zone, accent) {
  if (!zoneCenter(zone)) return null;
  const wrap = E('div', 'zone-map');
  wrap.style.setProperty('--zc', accent);
  const canvas = E('div', 'zone-map-canvas');
  canvas.setAttribute('role', 'application');
  canvas.setAttribute('aria-label', zone.name + ' 지도 — 장소 핀');
  wrap.appendChild(canvas);
  wrap.appendChild(buildZoneMapLink(zone, accent));
  ZONE_MAP_REG.push({ el: canvas, zone: zone, accent: accent, map: null });
  return wrap;
}

function initLeafletMap(entry) {
  if (entry.el.dataset.init === '1' || !window.L) return;
  entry.el.dataset.init = '1';
  const map = L.map(entry.el, { scrollWheelZoom: false, dragging: !L.Browser.mobile, zoomControl: true, attributionControl: true });
  entry.map = map;
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19, attribution: '© OpenStreetMap, © CARTO'
  }).addTo(map);

  const pts = [];
  const routePts = [];   // 동선용 — 배열 순서가 곧 도보 순서 (offzone 은 제외)
  const legendItems = [];
  let num = 0;
  entry.zone.sections.forEach(s => s.places.forEach(p => {
    if (typeof p.lat !== 'number' || typeof p.lng !== 'number') return;
    num++;
    const rec = !!p.recommended;
    const bg = rec ? '#d4af37' : entry.accent;
    const ic = L.divIcon({
      className: 'zm-pin' + (rec ? ' is-rec' : ''),
      html: '<span class="zm-pin-dot" style="background:' + bg + '">' + num + '</span>',
      iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -13]
    });
    const m = L.marker([p.lat, p.lng], { icon: ic, title: p.name_ko, riseOnHover: true }).addTo(map);
    const pop = E('div', 'map-pop');
    pop.appendChild(E('div', 'mp-name', num + '. ' + p.name_ko + (rec ? ' ★' : '')));
    if (p.feature) pop.appendChild(rich(E('div', 'mp-feat'), p.feature));
    if (p.maps_url) {
      const a = E('a', 'mp-link', '구글맵 열기 →');
      a.href = p.maps_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      pop.appendChild(a);
    }
    m.bindPopup(pop);
    legendItems.push({ num: num, name: p.name_ko, rec: rec, bg: bg, lat: p.lat, lng: p.lng, marker: m, btn: null });
    // offzone(구역서 멀리 떨어진 장소)은 fitBounds 프레이밍에서 제외 — 핀·범례·팝업은 그대로,
    // 지도 초기 줌만 구역 군집에 맞춤. 범례 칩 탭하면 그 핀으로 setView 됨.
    if (!p.offzone) { pts.push([p.lat, p.lng]); routePts.push([p.lat, p.lng]); }
  }));

  // ===== 동선 — 구역 도보 순서 =====
  // 번호 핀 1→2→3 을 점선으로 잇는다. **데이터 배열 순서가 곧 동선**이므로 별도 순서 필드가 없다.
  // 순서를 바꾸려면 places 배열의 순서를 바꾼다 (번호·범례·동선이 한꺼번에 따라옴).
  //
  // ⚠ 직선이다. 실제 도로·골목을 따라가지 않는다.
  //   도쿄 메인 매거진은 OSRM 으로 도로 곡선을 그리지만, 그건 CSP 에 connect-src 가 열려 있어서 가능했다.
  //   이 앱은 default-src 'none' + connect-src 없음 = fetch 자체가 불가고, CSP 완화는 금지다 (CLAUDE.md § 12).
  //   따라서 "대략 이 순서로 이 방향" 까지만 보여주고, 정확한 길찾기는 카드·팝업의 구글맵 링크가 담당한다.
  //
  // 하루에 한쪽만 도는 원정(교토: 남쪽 vs 북서쪽)은 zone.noRoute = true 로 선을 끈다.
  // 전부 이으면 "이 순서로 다 돌면 된다"는 잘못된 신호가 된다.
  const bh = GUIDE_DATA.base_hotel;
  const hotel = (bh && typeof bh.lat === 'number' && typeof bh.lng === 'number') ? [bh.lat, bh.lng] : null;
  const hasRoute = !entry.zone.noRoute && routePts.length >= 2;

  if (hasRoute) {
    // 숙소 좌표가 생기면 도쿄식 loop (숙소 → 장소들 → 숙소). 지금은 숙소 미정이라 장소들만 잇는다.
    const path = hotel ? [hotel].concat(routePts, [hotel]) : routePts.slice();
    L.polyline(path, {
      color: entry.accent, weight: 3, opacity: .6,
      dashArray: '5, 7', lineCap: 'round', lineJoin: 'round', interactive: false
    }).addTo(map);
  }

  // 숙소 핀 — base_hotel 에 좌표가 들어오면 자동으로 나타난다. 없으면 아무것도 안 그린다.
  if (hotel) {
    const hIc = L.divIcon({
      className: 'zm-pin is-home',
      html: '<span class="zm-pin-dot zm-pin-home"></span>',
      iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -13]
    });
    const hm = L.marker(hotel, { icon: hIc, title: bh.name || '숙소', zIndexOffset: -100 }).addTo(map);
    const hp = E('div', 'map-pop');
    hp.appendChild(E('div', 'mp-name', '숙소 · ' + (bh.name || '')));
    if (bh.area) hp.appendChild(E('div', 'mp-feat', bh.area));
    hm.bindPopup(hp);
    pts.push(hotel);
  }

  // ===== 이름↔핀 하이라이트 연동 =====
  const canvas = entry.el;
  let activeIdx = -1;
  const markerEl = (it) => { try { return it.marker.getElement(); } catch (e) { return null; } };
  function setHover(idx, on) {
    const it = legendItems[idx]; if (!it) return;
    const el = markerEl(it); if (el) el.classList.toggle('zm-pin--hover', !!on);
    if (it.btn) it.btn.classList.toggle('is-hover', !!on);
  }
  function deactivate(it) {
    if (!it) return;
    const el = markerEl(it); if (el) el.classList.remove('zm-pin--active');
    try { it.marker.setZIndexOffset(0); } catch (e) {}
    if (it.btn) { it.btn.classList.remove('is-active'); it.btn.setAttribute('aria-pressed', 'false'); }
  }
  function clearActive() {
    if (activeIdx >= 0) deactivate(legendItems[activeIdx]);
    activeIdx = -1;
    canvas.classList.remove('zm-focus');
  }
  function selectPlace(idx, opts) {
    opts = opts || {};
    if (activeIdx >= 0 && activeIdx !== idx) deactivate(legendItems[activeIdx]);
    const it = legendItems[idx]; if (!it) return;
    activeIdx = idx;
    canvas.classList.add('zm-focus');
    const el = markerEl(it); if (el) el.classList.add('zm-pin--active');
    try { it.marker.setZIndexOffset(1000); } catch (e) {}
    if (it.btn) { it.btn.classList.add('is-active'); it.btn.setAttribute('aria-pressed', 'true'); }
    if (opts.pan !== false) { try { map.setView([it.lat, it.lng], Math.max(map.getZoom(), 15), { animate: true }); } catch (e) {} }
    if (opts.popup !== false) { try { it.marker.openPopup(); } catch (e) {} }
  }

  if (legendItems.length) {
    const legend = E('div', 'zm-legend');
    legend.appendChild(E('div', 'zm-legend-hint', hasRoute
      ? '점선은 번호 순서 · 직선이라 실제 길은 아니에요 — 이름을 탭하면 위치가 표시돼요'
      : '이름을 탭하면 지도에서 위치가 표시돼요'));
    legendItems.forEach((it, idx) => {
      const b = E('button', 'zm-leg-item' + (it.rec ? ' is-rec' : ''));
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      const badge = E('span', 'zm-leg-num', String(it.num));
      badge.style.background = it.bg;
      b.appendChild(badge);
      b.appendChild(E('span', 'zm-leg-name', it.name + (it.rec ? ' ★' : '')));
      b.addEventListener('click', () => { try { selectPlace(idx); } catch (e) {} });
      b.addEventListener('mouseenter', () => setHover(idx, true));
      b.addEventListener('mouseleave', () => setHover(idx, false));
      it.btn = b;
      legend.appendChild(b);
    });
    canvas.parentNode.insertBefore(legend, canvas.nextSibling);
  }

  // 핀 → 범례 칩 연동 (탭 시 강조, 호버 미리보기). 팝업은 Leaflet 기본 동작이 띄움.
  legendItems.forEach((it, idx) => {
    it.marker.on('click', () => {
      try { selectPlace(idx, { pan: false, popup: false }); } catch (e) {}
      if (it.btn) { it.btn.classList.add('is-flash'); setTimeout(() => { try { it.btn.classList.remove('is-flash'); } catch (e) {} }, 1200); }
    });
    it.marker.on('mouseover', () => setHover(idx, true));
    it.marker.on('mouseout', () => setHover(idx, false));
  });
  map.on('click', () => { try { clearActive(); } catch (e) {} });

  // pad() 는 위경도 박스를 비율로 넓힐 뿐이라, 가장자리 핀의 아이콘(위로 솟은 모양)이 잘림.
  // 픽셀 단위 padding 을 같이 줘야 원정처럼 넓게 퍼진 좌표군에서도 핀이 안 잘림.
  // 좌표 1개짜리 구역은 bounds 크기가 0 이라 fitBounds 가 maxZoom(19) 까지 튄다 → setView 로 분기.
  const FIT = { padding: [30, 30] };
  const frame = () => {
    if (!pts.length) return;
    if (pts.length === 1) map.setView(pts[0], 15);
    else map.fitBounds(L.latLngBounds(pts).pad(0.12), FIT);
  };
  frame();
  setTimeout(() => { try { map.invalidateSize(); frame(); } catch (e) {} }, 120);
}

function setupZoneMaps() {
  const tryInit = (entry) => { if (window.L) initLeafletMap(entry); };
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((ents, obs) => {
      ents.forEach(e => {
        if (e.isIntersecting) {
          const entry = ZONE_MAP_REG.find(x => x.el === e.target);
          if (entry) { tryInit(entry); if (entry.el.dataset.init === '1') obs.unobserve(e.target); }
        }
      });
    }, { rootMargin: '250px 0px 250px 0px' });
    ZONE_MAP_REG.forEach(x => io.observe(x.el));
  }
  // Leaflet(defer) 로드 완료 후, 현재 화면에 가까운 지도들 보강 초기화
  window.addEventListener('load', () => {
    if (!window.L) return;
    ZONE_MAP_REG.forEach(entry => {
      if (entry.el.dataset.init === '1') return;
      const r = entry.el.getBoundingClientRect();
      if (r.top < window.innerHeight + 350 && r.bottom > -350) initLeafletMap(entry);
    });
  });
}

function refreshVisibleMaps() {
  ZONE_MAP_REG.forEach(e => { if (e.map && e.el.offsetParent !== null) { try { e.map.invalidateSize(); } catch (_) {} } });
}

/* 카테고리 섹션 한 덩이 — 구역과 원정이 공유 (필터가 .catsec 단위로 동작하므로 구조 동일해야 함) */
function buildCatSection(s) {
  const cat = CAT[s.category] || { key: 'sight', color: 'var(--indigo-light)', en: s.category, icon: SVG.sight };
  const cs = E('div', 'catsec');
  cs.dataset.cat = cat.key;
  const ch = E('div', 'cat-head');
  const badge = E('span', 'cat-badge');
  badge.style.background = cat.color;
  badge.appendChild(icon(cat.icon));
  badge.appendChild(E('span', null, cat.en));
  ch.appendChild(badge);
  ch.appendChild(E('span', 'cat-ko', s.category));
  ch.appendChild(E('span', 'cat-line'));
  ch.appendChild(E('span', 'cat-cnt', s.places.length + '곳'));
  cs.appendChild(ch);
  const grid = E('div', 'grid');
  s.places.forEach(p => grid.appendChild(buildCard(p, cat)));
  cs.appendChild(grid);
  return cs;
}

/* 시간표 — zone.schedule 이 있을 때만 그린다 (없으면 null 반환 → 기존 구역은 그대로).
   ⚠ 분 단위 강박 일정표가 아니다 (PRD § 7). 시각을 박는 것은
     ① 시설 마감처럼 어길 수 없는 것 ② 배 시각처럼 놓치면 끝나는 것 뿐이고,
     나머지는 순서와 대략적인 시작점만 준다. 늦어도 뒤로 밀면 그만인 구조를 유지할 것. */
function buildSchedule(zone) {
  if (!zone.schedule || !zone.schedule.length) return null;
  const wrap = E('div', 'zone-sched');
  const h = E('div', 'zs-head');
  h.appendChild(icon(SVG.clock, 'zs-ico'));
  h.appendChild(E('span', 'zs-head-t', '이 날의 흐름'));
  h.appendChild(E('span', 'zs-head-n', zone.schedule.length + '단계'));
  wrap.appendChild(h);
  zone.schedule.forEach(s => {
    const row = E('div', 'zs-row');
    row.appendChild(E('div', 'zs-t', s.t || ''));
    const body = E('div', 'zs-b');
    body.appendChild(E('div', 'zs-w', s.w || ''));
    if (s.n) rich(body.appendChild(E('div', 'zs-n')), s.n);
    const mv = buildMove(s.move);
    if (mv) body.appendChild(mv);
    row.appendChild(body);
    wrap.appendChild(row);
  });
  return wrap;
}

/* 이동 구간 — 노선 기호 + 구글맵 대중교통 길찾기.
   길을 잃는 건 대개 "어디로 가야 하나"가 아니라 "지금 뭘 타야 하나"를 몰라서다.
   그래서 노선 기호(M·C…)를 현지 안내판과 같은 색으로 먼저 보여주고,
   실제 경로·환승·시각은 구글맵에 넘긴다 (실시간이 정확하다). */
function moveUrl(m) {
  return 'https://www.google.com/maps/dir/?api=1' +
    '&origin=' + encodeURIComponent(m.from) +
    '&destination=' + encodeURIComponent(m.to) +
    '&travelmode=transit';
}
function buildMove(m) {
  if (!m || !m.from || !m.to) return null;
  const a = document.createElement('a');
  a.className = 'mv';
  a.href = moveUrl(m);
  a.target = '_blank';
  a.rel = 'noopener noreferrer';

  const lines = E('span', 'mv-lines');
  (m.lines || []).forEach(name => {
    const info = (typeof METRO !== 'undefined' && METRO[name]) || null;
    const b = E('span', 'mv-ln');
    if (info) {
      const dot = E('span', 'mv-c', info.c);
      dot.style.background = info.color;
      b.appendChild(dot);
    }
    b.appendChild(E('span', 'mv-nm', name));
    lines.appendChild(b);
  });
  a.appendChild(lines);
  if (m.via) a.appendChild(E('span', 'mv-via', m.via));
  a.appendChild(E('span', 'mv-go', '구글맵 길찾기 →'));
  return a;
}

/* **강조** 를 <b> 로. innerHTML 을 쓰지 않고 조각을 나눠 textContent 로 넣는다 (CSP 정책 유지) */
function rich(el, str) {
  String(str == null ? '' : str).split(/\*\*/).forEach((part, i) => {
    el.appendChild(i % 2 ? E('b', null, part) : E('span', null, part));
  });
  return el;
}

/* ===== 최상위 탭 — 여행 / 알아둘 것 / 일본어 =====
   페이지 전체를 세 갈래로 나눈다. 셋의 성격이 다르기 때문이다:
     여행    — 어디를 가나 (일정·장소·지도·동선)
     알아둘 것 — 어떻게 대처하나 (응급·지진·더위·매너·결제·통신)
     일본어   — 뭐라고 말하나 (71 문장)
   구역 칩·분류 필터는 '여행' 에서만 의미가 있으므로 다른 탭에서는 내비를 통째로 숨긴다.
   각 탭 안의 항목은 네이티브 <details> — 필요한 것만 펴서 본다. */
const TOP_TABS = [
  { key: 'trip',  label: '여행',      nav: true  },
  { key: 'notes', label: '알아둘 것', nav: false, build: function () { return buildTripNotes(); } },
  { key: 'jp',    label: '일본어',    nav: false, build: function () { return buildJpPanel(); } }
];
let PANEL = {};

function renderTopTabs() {
  const host = document.getElementById('toptabs');
  const body = document.getElementById('body');
  const nav = document.getElementById('nav');
  if (!host || !body) return;

  const btns = [];
  TOP_TABS.forEach((t, idx) => {
    const panel = E('div', 'toppanel' + (idx === 0 ? '' : ' is-hide'));
    panel.id = 'panel-' + t.key;
    if (t.build) panel.appendChild(t.build());
    body.appendChild(panel);
    PANEL[t.key] = panel;

    const b = E('button', 'toptab' + (idx === 0 ? ' is-on' : ''), t.label);
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
    b.addEventListener('click', () => {
      btns.forEach((x, i) => {
        const on = x === b;
        x.classList.toggle('is-on', on);
        x.setAttribute('aria-selected', on ? 'true' : 'false');
        PANEL[TOP_TABS[i].key].classList.toggle('is-hide', !on);
        if (on && nav) nav.classList.toggle('is-hide', !TOP_TABS[i].nav);
      });
      // 탭을 바꾸면 그 화면의 처음부터 보는 게 맞다
      try { host.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
      if (t.nav) { try { refreshVisibleMaps(); } catch (e) {} }
    });
    btns.push(b);
    host.appendChild(b);
  });
}

function buildTripNotes() {
  const wrap = E('div', null);
  (typeof TRIP_NOTES === 'undefined' ? [] : TRIP_NOTES).forEach(n => {
    const d = document.createElement('details');
    d.className = 'ti-item';
    const s = document.createElement('summary');
    s.className = 'ti-sum';
    s.appendChild(E('span', 'ti-ico', n.icon || ''));
    s.appendChild(E('span', 'ti-lbl', n.label || ''));
    s.appendChild(E('span', 'ti-cnt', String((n.items || []).length)));
    d.appendChild(s);
    const ul = E('ul', 'ti-list');
    (n.items || []).forEach(t => ul.appendChild(rich(E('li', null), t)));
    d.appendChild(ul);
    wrap.appendChild(d);
  });
  return wrap;
}

function buildJpPanel() {
  const wrap = E('div', null);
  wrap.appendChild(E('p', 'ti-lede', '상황을 골라 펴면 돼. 일본어를 그대로 보여줘도 통해.'));
  (typeof JP_SCENARIOS === 'undefined' ? [] : JP_SCENARIOS).forEach(scn => {
    const d = document.createElement('details');
    d.className = 'ti-item';
    const s = document.createElement('summary');
    s.className = 'ti-sum';
    s.appendChild(E('span', 'ti-ico', scn.icon || ''));
    s.appendChild(E('span', 'ti-lbl', scn.label || scn.id));
    s.appendChild(E('span', 'ti-cnt', String((scn.phrases || []).length)));
    d.appendChild(s);

    (scn.phrases || []).forEach(p => {
      const row = E('div', 'ph');
      row.appendChild(E('div', 'ph-ko', p.ko));
      row.appendChild(E('div', 'ph-ja', p.ja));
      // 로마자 → 그 아래 한글 발음. 로마자를 못 읽어도 소리 내어 읽을 수 있게.
      if (p.romaji) row.appendChild(E('div', 'ph-ro', p.romaji));
      if (p.kr) row.appendChild(E('div', 'ph-kr', p.kr));
      d.appendChild(row);
    });
    if (scn.tips && scn.tips.length) {
      const t = E('div', 'ph-tips');
      t.appendChild(E('div', 'ph-tips-h', '팁'));
      const ul = E('ul', null);
      scn.tips.forEach(x => ul.appendChild(rich(E('li', null), x)));
      t.appendChild(ul);
      d.appendChild(t);
    }
    wrap.appendChild(d);
  });
  return wrap;
}

/* 선착장 ↔ 숙소 이동 블록.
   도착(ARRIVAL)은 첫 구역 앞, 복귀(DEPARTURE)는 마지막 구역 뒤에 놓는다 —
   여행이 시작되고 끝나는 순서 그대로 페이지에 박히도록. */
function buildTransfer(kind) {
  const T = GUIDE_DATA.transfer && GUIDE_DATA.transfer[kind];
  if (!T) return null;
  const sec = E('section', 'transfer tr-' + kind);
  sec.id = 'tr-' + kind;

  const head = E('div', 'tr-head');
  head.appendChild(E('span', 'tr-tag', T.tag));
  head.appendChild(E('h2', 'tr-title', T.title));
  if (T.date) head.appendChild(E('span', 'tr-date', T.date));
  sec.appendChild(head);
  if (T.lede) sec.appendChild(E('p', 'tr-lede', T.lede));
  const tmv = buildMove(T.move);
  if (tmv) { tmv.classList.add('mv-hero'); sec.appendChild(tmv); }

  if (T.warn) {
    const w = E('div', 'tr-warn');
    w.appendChild(icon(SVG.clock, 'tr-warn-ico'));
    // ** 강조 ** 만 <b> 로 — 정적 문자열이 아니므로 innerHTML 대신 조각을 나눠 textContent 로 넣는다
    const box = E('div', 'tr-warn-t');
    T.warn.split(/\*\*/).forEach((part, i) => {
      box.appendChild(i % 2 ? E('b', null, part) : E('span', null, part));
    });
    w.appendChild(box);
    sec.appendChild(w);
  }

  (T.steps || []).forEach(s => {
    const row = E('div', 'tr-row');
    row.appendChild(E('div', 'tr-t', s.t || ''));
    const b = E('div', 'tr-b');
    b.appendChild(E('div', 'tr-w', s.w || ''));
    if (s.d) b.appendChild(E('div', 'tr-d', s.d));
    row.appendChild(b);
    sec.appendChild(row);
  });

  if (T.need && T.need.length) {
    const nb = E('div', 'tr-need');
    nb.appendChild(E('div', 'tr-need-h', '챙길 것'));
    const ul = E('ul', 'tr-need-l');
    T.need.forEach(n => ul.appendChild(E('li', null, n)));
    nb.appendChild(ul);
    sec.appendChild(nb);
  }
  if (T.tip) sec.appendChild(E('p', 'tr-tip', T.tip));
  return sec;
}

function renderZones() {
  // 일정·장소는 '여행' 탭 안에 들어간다 (renderTopTabs 가 먼저 패널을 만든다)
  const body = PANEL.trip || document.getElementById('body');
  const arr = buildTransfer('arrival');
  if (arr) body.appendChild(arr);

  GUIDE_DATA.zones.forEach((zone, zi) => {
    const accent = zoneAccent(zi);
    const sec = E('section', 'zone');
    sec.id = 'zone-' + zone.id;
    sec.style.setProperty('--zc', accent);

    const head = E('div', 'zone-head');
    const tag = E('span', 'zone-tag');
    // zone.tag 가 있으면 그걸 쓴다 (DAY 1 등). 없으면 기존 AREA 번호.
    tag.appendChild(E('span', null, zone.tag || ('AREA ' + String(zone.id).padStart(2, '0'))));
    head.appendChild(tag);
    if (zone.date) head.appendChild(E('span', 'zone-date', zone.date));
    head.appendChild(E('h2', 'zone-name', zone.name));
    if (zone.access) {
      const acc = E('span', 'zone-access');
      acc.appendChild(icon(SVG.clock));
      acc.appendChild(E('span', null, zone.access));
      head.appendChild(acc);
    }
    sec.appendChild(head);

    const sch = buildSchedule(zone);
    if (sch) sec.appendChild(sch);

    const zl = buildZoneMap(zone, accent);
    if (zl) sec.appendChild(zl);

    zone.sections.forEach(s => sec.appendChild(buildCatSection(s)));
    body.appendChild(sec);
  });

  // 복귀 블록이 '여행' 탭의 맨 끝. (도착 블록은 renderZones 시작 전에 이미 넣었다)
  const dep = buildTransfer('departure');
  if (dep) body.appendChild(dep);
}

/* ===== 원정(Excursion) 섹션 렌더 ===== */
function blockH(en, ko) {
  const h = E('div', 'block-h');
  h.appendChild(E('span', 'bh-bar'));
  h.appendChild(E('span', 'bh-t', en));
  h.appendChild(E('span', 'bh-ko', ko));
  return h;
}
/* 구글맵 길찾기 딥링크 — 숙소(미정이면 오사카역) → 원정 목적지.
   직선이 아니라 실제 경로를 transit(전철) / driving(택시) 모드로 표시. */
function excursionOrigin() {
  const b = GUIDE_DATA.base_hotel;
  return (b && b.name) ? (b.name + ', Osaka') : 'Osaka Station';
}
function excursionDirUrl(ex, mode) {
  return 'https://www.google.com/maps/dir/?api=1' +
    '&origin=' + encodeURIComponent(excursionOrigin()) +
    '&destination=' + encodeURIComponent(ex.destinationQuery || ex.title) +
    '&travelmode=' + (mode === 'driving' ? 'driving' : 'transit');
}
function renderExcursions() {
  const body = PANEL.trip || document.getElementById('body');
  EXCURSIONS.forEach(ex => body.appendChild(buildExcursion(ex)));
}

function buildExcursion(ex) {
  const acc = ex.accent;
  const sec = E('section', 'excursion');
  sec.id = 'ex-' + ex.id;
  sec.style.setProperty('--zc', acc);

  const head = E('div', 'zone-head');
  const tag = E('span', 'zone-tag');
  tag.appendChild(E('span', null, 'EXCURSION'));
  head.appendChild(tag);
  head.appendChild(E('h2', 'zone-name', ex.title));
  if (ex.area) {
    const ac = E('span', 'zone-access');
    ac.appendChild(icon(SVG.clock));
    ac.appendChild(E('span', null, ex.area));
    head.appendChild(ac);
  }
  sec.appendChild(head);

  if (ex.scopeNote) {
    const scope = E('div', 'ex-scope');
    scope.appendChild(icon(SVG.star));
    scope.appendChild(E('span', null, ex.scopeNote));
    sec.appendChild(scope);
  }
  if (ex.intro) sec.appendChild(E('p', 'ex-intro', ex.intro));

  // 원정지 지도 — zone 과 스키마가 같으므로 buildZoneMap 을 그대로 재사용.
  // ⚠ zone 처럼 보이게 재조립하는 자리다. 여기서 안 넘긴 필드는 지도에서 통째로 사라진다
  //    (실제로 noRoute 를 빠뜨려 교토에 동선이 그려지는 버그가 났다).
  //    buildZoneMap/initLeafletMap 이 읽는 필드를 늘리면 이 줄도 같이 늘릴 것.
  if (ex.sections && ex.sections.length) {
    const zl = buildZoneMap({ name: ex.title, sections: ex.sections, noRoute: ex.noRoute }, acc);
    if (zl) sec.appendChild(zl);
  }

  // 가는 법
  if (ex.routes && ex.routes.length) {
    sec.appendChild(blockH('Getting There', '가는 법 — ' + ex.routes.length + '가지'));
    const dir = document.createElement('a');
    dir.className = 'dir-btn';
    dir.href = excursionDirUrl(ex, 'transit');
    dir.target = '_blank';
    dir.rel = 'noopener noreferrer';
    const dico = E('span', 'dir-ico');
    dico.appendChild(icon(SVG.route));
    dir.appendChild(dico);
    const dtx = E('span', 'dir-text');
    dtx.appendChild(E('span', 'dir-t', ex.title + ' 길찾기'));
    dtx.appendChild(E('span', 'dir-sub', excursionOrigin() + ' 출발 · 대중교통 · 구글맵에서 열기'));
    dir.appendChild(dtx);
    dir.appendChild(icon(SVG.arrow, 'dir-arrow'));
    sec.appendChild(dir);

    ex.routes.forEach(r => {
      const mode = /택시|didi|driving|차로/i.test(r.name) ? 'driving' : 'transit';
      const card = document.createElement('a');
      card.className = 'route-card';
      card.href = excursionDirUrl(ex, mode);
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      const rh = E('div', 'rc-head');
      rh.appendChild(E('span', 'rc-num', String(r.n)));
      const nm = E('span', 'rc-name');
      nm.appendChild(E('span', null, r.name));
      if (r.best) nm.appendChild(E('span', 'rc-best', '추천'));
      rh.appendChild(nm);
      rh.appendChild(E('span', 'rc-meta', r.time + ' · ' + r.fare));
      card.appendChild(rh);
      const steps = E('div', 'rc-steps');
      r.steps.forEach((st, i) => {
        if (i > 0) {
          const conn = E('span', 'rc-conn');
          conn.appendChild(icon(SVG.arrow));
          if (st.via) conn.appendChild(E('span', null, st.via));
          steps.appendChild(conn);
        }
        steps.appendChild(E('span', 'rc-step', st.s));
      });
      card.appendChild(steps);
      if (r.note) card.appendChild(E('p', 'rc-note', r.note));
      const go = E('div', 'rc-go');
      go.appendChild(icon(SVG.route));
      go.appendChild(E('span', null, (mode === 'driving' ? '택시·차 경로로' : '전철 경로로') + ' 구글맵 길찾기'));
      go.appendChild(icon(SVG.arrow, 'rc-go-arrow'));
      card.appendChild(go);
      sec.appendChild(card);
    });
  }

  // 도착 후
  if (ex.arrival && ex.arrival.length) {
    sec.appendChild(blockH('After Arrival', '도착 후'));
    const ul = E('ul', 'info-list');
    ex.arrival.forEach(t => {
      const li = document.createElement('li');
      li.appendChild(E('span', 'dot'));
      li.appendChild(E('span', null, t));
      ul.appendChild(li);
    });
    sec.appendChild(ul);
  }

  // 해야 할 것
  if (ex.todo && ex.todo.length) {
    sec.appendChild(blockH('To-Do', '해야 할 것'));
    const tl = E('div', 'todo-list');
    ex.todo.forEach(it => {
      const row = E('div', 'todo-item');
      const mk = E('span', 'todo-mark');
      mk.appendChild(icon(SVG.star));
      row.appendChild(mk);
      const tx = E('div');
      tx.appendChild(E('div', 'todo-t', it.t));
      tx.appendChild(E('div', 'todo-d', it.d));
      row.appendChild(tx);
      tl.appendChild(row);
    });
    sec.appendChild(tl);
  }

  // 원정지 장소 — 구역과 같은 .catsec 구조라 상단 분류 필터가 그대로 걸림
  if (ex.sections && ex.sections.length) {
    sec.appendChild(blockH('Places', '원정지 장소'));
    if (ex.dineNote) sec.appendChild(E('p', 'dine-note', ex.dineNote));
    ex.sections.forEach(s => sec.appendChild(buildCatSection(s)));
  }

  return sec;
}


/* 스크롤 시 현재 구역 칩 하이라이트
   ⚠ 칩 강조 시 절대 페이지(세로)를 스크롤하지 않음 — 가로 스크롤러만 이동.
      (이전 버그: 칩이 sticky 내비 안에 있어 scrollIntoView 가 페이지를 맨 위로 끌어올림) */
function setupScrollSpy() {
  const scroller = document.getElementById('zone-nav');
  const chips = {};
  document.querySelectorAll('.zone-chip').forEach(c => { chips[c.dataset.target] = c; });
  function centerChip(c) {
    if (!scroller) return;
    const cr = c.getBoundingClientRect(), sr = scroller.getBoundingClientRect();
    const delta = (cr.left - sr.left) - (sr.width - cr.width) / 2;
    scroller.scrollBy({ left: delta, behavior: 'smooth' });  // 가로만. 세로 스크롤 미관여
  }
  const io = new IntersectionObserver((ents) => {
    ents.forEach(e => {
      if (e.isIntersecting) {
        Object.values(chips).forEach(c => c.removeAttribute('aria-current'));
        const c = chips[e.target.id];
        if (c) { c.setAttribute('aria-current', 'true'); centerChip(c); }
      }
    });
  }, { rootMargin: '-110px 0px -65% 0px', threshold: 0 });
  document.querySelectorAll('.zone, .excursion').forEach(z => io.observe(z));
}

/* 맨 위로 버튼 */
function setupToTop() {
  const btn = document.getElementById('totop');
  btn.appendChild(icon(SVG.up));
  btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  window.addEventListener('scroll', () => { btn.classList.toggle('show', window.scrollY > 600); }, { passive: true });
}

/* ============================================================
   init
   ============================================================ */
document.title = GUIDE_DATA.title;
renderMast();
renderTopTabs();
renderNav();
renderZones();
renderExcursions();
setupScrollSpy();
setupToTop();
setupZoneMaps();
</script>
